      <button class="nav-btn" data-view="tasks"><span class="nav-ico">☷</span><span>待辦總覽</span><span class="nav-count" id="nav-task-count">0</span></button>

      <button class="nav-btn" data-view="trash"><span class="nav-ico">▱</span><span>回收區</span><span class="nav-count" id="nav-trash-count">0</span></button>
    </nav>
    <div class="sidebar-bottom">
      <div class="privacy-note"><strong><span>◉</span> 資料保存在你的瀏覽器</strong><p>不需要登入。清除瀏覽器資料前，建議先匯出 JSON 備份。</p></div>

  </aside>
  <main class="main">
    <header class="topbar"><div class="topbar-left"><button class="mobile-menu" id="mobile-menu" aria-label="開啟導覽選單">☰</button><div><div class="eyebrow">YOUR PERSONAL NOTEBOOK</div><h1 class="page-title" id="top-title">儀表板</h1></div></div><div class="topbar-date"><span>☼</span><span id="today-label"></span></div></header>
    <section class="content" id="view" aria-live="polite"></section>
  </main>
</div>
<div class="toast" id="toast" role="status"></div><div id="modal-root"></div>
<script>
(() => {
'use strict';
const DB_KEY='shiji_memo_local_v1';
const MODES={meeting:{label:'會議紀錄',icon:'◷',className:'meeting',description:'整理討論、決議與後續任務'},course:{label:'課程筆記',icon:'✎',className:'course',description:'整理概念、觀念重點與筆記'},conversation:{label:'一般對話',icon:'☏',className:'conversation',description:'歸納對話摘要與討論重點'}};
const BLOCKS={summary:{label:'精簡摘要',desc:'快速掌握主要內容'},keypoints:{label:'討論重點',desc:'條列重要資訊'},decisions:{label:'決議與結論',desc:'整理明確決定或共識'},tasks:{label:'待辦事項',desc:'建立可追蹤的互動任務'},notes:{label:'課程筆記',desc:'整理概念、定義與例子'}};
const DEFAULT_BLOCKS={meeting:['summary','keypoints','decisions','tasks'],course:['summary','keypoints','notes'],conversation:['summary','keypoints']};
const STATUS={todo:'待處理',doing:'進行中',done:'已完成'};
let db=loadDB();let currentView='dashboard';let editor=null;let speech=null;let speechActive=false;let speechPaused=false;let speechError=false;let speechTranscript='';let toastTimer=null;let draftTimer=null;let importPlan=null;let taskFilter='all';let historyFilters={q:'',from:'',to:'',mode:'all'};
const $=s=>document.querySelector(s);const $$=s=>Array.from(document.querySelectorAll(s));
function loadDB(){try{const raw=localStorage.getItem(DB_KEY);if(raw){const v=JSON.parse(raw);return {records:Array.isArray(v.records)?v.records:[],trash:Array.isArray(v.trash)?v.trash:[],draft:v.draft||null,settings:v.settings||{}}}}catch(e){console.warn('讀取本機資料失敗',e)}return {records:[],trash:[],draft:null,settings:{}}}
function persist(){try{localStorage.setItem(DB_KEY,JSON.stringify(db));return true}catch(e){toast('本機儲存空間不足或無法寫入，請先匯出備份。',true);return false}}
function makeId(){return 'memo_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9)}
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function formatDate(date){if(!date)return '未設定日期';const d=new Date(date+'T00:00:00');if(Number.isNaN(d.getTime()))return date;return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}
function formatDateTime(iso){if(!iso)return '';const d=new Date(iso);if(Number.isNaN(d.getTime()))return '';return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clone(v){return JSON.parse(JSON.stringify(v))}
function toast(msg,error=false){const node=$('#toast');node.textContent=msg;node.style.background=error?'#8d4b43':'#343a31';node.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove('show'),3300)}
function askModal(title,message,confirmText='確認',danger=false){return new Promise(resolve=>{const root=$('#modal-root');root.innerHTML=`<div class="modal-backdrop" role="dialog" aria-modal="true"><div class="modal"><h3>${esc(title)}</h3><p>${esc(message)}</p><div class="modal-actions"><button class="btn" data-modal="cancel">取消</button><button class="btn ${danger?'danger':'primary'}" data-modal="confirm">${esc(confirmText)}</button></div></div></div>`;const finish=v=>{root.innerHTML='';resolve(v)};root.querySelector('[data-modal="cancel"]').onclick=()=>finish(false);root.querySelector('[data-modal="confirm"]').onclick=()=>finish(true);root.querySelector('.modal-backdrop').onclick=e=>{if(e.target.classList.contains('modal-backdrop'))finish(false)};root.querySelector('[data-modal="confirm"]').focus()})}
function setPage(view,title){currentView=view;$('#top-title').textContent=title;$$('.nav-btn[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#sidebar').classList.remove('open');renderCurrent()}
function updateNavCounts(){const taskCount=db.records.reduce((n,r)=>n+(r.tasks||[]).filter(t=>t.status!=='done').length,0);$('#nav-record-count').textContent=db.records.length;$('#nav-task-count').textContent=taskCount;$('#nav-trash-count').textContent=db.trash.length;$('#today-label').textContent=formatDate(todayISO())}
function renderCurrent(){updateNavCounts();const v=$('#view');if(currentView==='dashboard')v.innerHTML=renderDashboard();else if(currentView==='new'||currentView==='editor')v.innerHTML=renderEditor();else if(currentView==='history')v.innerHTML=renderHistory();else if(currentView==='tasks')v.innerHTML=renderTasksOverview();else if(currentView==='settings')v.innerHTML=renderSettings();else if(currentView==='trash')v.innerHTML=renderTrash();else v.innerHTML=renderDashboard();bindViewEvents();}
function allTasks(){const result=[];db.records.forEach(r=>(r.tasks||[]).forEach(t=>result.push({...t,recordId:r.id,recordName:r.name||'未命名紀錄',recordDate:r.date,mode:r.mode})));return result}
function modeIcon(mode){return MODES[mode]?.icon||'▤'}
function modeClass(mode){return `kind-${MODES[mode]?.className||'meeting'}`}
function badgeMode(mode){return `<span class="badge ${mode==='meeting'?'green':mode==='course'?'warm':'purple'}">${esc(MODES[mode]?.label||'紀錄')}</span>`}
function badgeExample(r){return r.isExample?'<span class="badge warm">範例資料</span>':''}
function latestRecords(){return [...db.records].sort((a,b)=>(b.updatedAt||b.createdAt||'').localeCompare(a.updatedAt||a.createdAt||'')).slice(0,5)}
function taskCounts(){const ts=allTasks();return {all:ts.length,todo:ts.filter(t=>t.status==='todo').length,doing:ts.filter(t=>t.status==='doing').length,done:ts.filter(t=>t.status==='done').length}}
function renderDashboard(){const tasks=taskCounts(),records=db.records;const kindCounts={meeting:records.filter(r=>r.mode==='meeting').length,course:records.filter(r=>r.mode==='course').length,conversation:records.filter(r=>r.mode==='conversation').length};const completed=tasks.all?Math.round(tasks.done/tasks.all*100):0;const recent=latestRecords();return `
<div class="greeting"><div class="overline">一頁一記，慢慢整理</div><h2>把重要的事，好好記下來。</h2><p>把會議、課程與日常對話收進一本溫暖的數位手帳。</p></div>
<div class="grid stats">
<div class="card stat-card"><div class="stat-top"><span>會議紀錄</span><span class="stat-icon">◷</span></div><div class="stat-num">${kindCounts.meeting}</div><div class="stat-desc">已保存的會議資料</div></div>
<div class="card stat-card"><div class="stat-top"><span>課程筆記</span><span class="stat-icon">✎</span></div><div class="stat-num">${kindCounts.course}</div><div class="stat-desc">累積的學習記錄</div></div>
<div class="card stat-card"><div class="stat-top"><span>一般對話</span><span class="stat-icon">☏</span></div><div class="stat-num">${kindCounts.conversation}</div><div class="stat-desc">可回顧的對話摘要</div></div>
<div class="card stat-card"><div class="stat-top"><span>未完成任務</span><span class="stat-icon">☷</span></div><div class="stat-num">${tasks.todo+tasks.doing}</div><div class="stat-desc">待處理 ${tasks.todo} 項・進行中 ${tasks.doing} 項</div></div>
</div>
<div class="dashboard-layout"><div class="card recent-card"><div class="section-head"><div><h3>最近的紀錄</h3><p>你最近整理過的內容</p></div><button class="btn small" data-view="history">查看全部　→</button></div>
${recent.length?`<div class="record-list">${recent.map(r=>`<button class="record-row" data-action="open-record" data-id="${esc(r.id)}" style="width:100%;text-align:left;background:transparent;border:0"><div class="record-kind ${modeClass(r.mode)}">${modeIcon(r.mode)}</div><div class="record-main"><div class="record-title">${esc(r.name||'未命名紀錄')}</div><div class="record-meta">${badgeMode(r.mode)} <span>${esc(formatDate(r.date))}</span>${badgeExample(r)}</div></div><span class="record-open">›</span></button>`).join('')}</div>`:`<div class="empty"><div class="empty-icon">✎</div><h4>這裡還是一本空白手帳</h4><p>建立第一筆紀錄，或載入範例，看看拾記 Memo 如何幫你整理內容。</p><div class="btn-group" style="justify-content:center"><button class="btn primary" data-action="new-record">＋ 建立新紀錄</button><button class="btn" data-action="load-sample">載入範例</button></div></div>`}
<div class="footer-note">統計依這個瀏覽器中保存的資料計算</div></div>
<div class="dashboard-side"><div class="card task-stats"><div class="section-head"><div><h3>任務進度</h3><p>跨會議待辦一覽</p></div><button class="btn small" data-view="tasks">管理 →</button></div><div class="task-stat-row"><div class="mini-stat"><strong>${tasks.todo}</strong><span>待處理</span></div><div class="mini-stat"><strong>${tasks.doing}</strong><span>進行中</span></div><div class="mini-stat"><strong>${tasks.done}</strong><span>已完成</span></div></div><div class="progress-track"><div class="progress-bar" style="width:${completed}%"></div></div><div style="font-size:10px;color:var(--muted);margin-top:8px">${tasks.all?`已完成 ${completed}% 的任務`:'建立待辦事項後，這裡會顯示進度'}</div></div>
<div class="card quick-card"><div class="section-head"><div><h3>快速操作</h3><p>從這裡開始</p></div></div><div class="quick-actions"><button class="quick-action" data-action="new-record"><span class="qa-icon">＋</span><strong>新增紀錄</strong><span>開始輸入或收音</span></button><button class="quick-action" data-view="history"><span class="qa-icon">▤</span><strong>查看全部紀錄</strong><span>搜尋與回顧</span></button><button class="quick-action" data-view="tasks"><span class="qa-icon">☷</span><strong>管理待辦</strong><span>追蹤工作進度</span></button><button class="quick-action" data-action="load-sample"><span class="qa-icon">✦</span><strong>載入範例</strong><span>體驗整理流程</span></button></div></div></div></div>
<div class="soft-note" style="margin-top:18px"><strong>關於本機整理：</strong>目前提供可操作的規則式文字整理，真正的 AI 服務尚未串接。資料會保存在此瀏覽器中；需要更換裝置時，可到「設定與資料管理」匯出備份。</div>`}
function freshEditor(){return {id:null,mode:'meeting',name:'',date:todayISO(),people:'',subject:'',teacher:'',participants:'',sourceText:'',customFocus:'',selectedBlocks:[...DEFAULT_BLOCKS.meeting],report:{summary:'',keypoints:'',decisions:'',notes:''},tasks:[],resultGenerated:false,isExample:false,createdAt:null,updatedAt:null}}
function initNewRecord(){speechStop(true);if(db.draft&&((db.draft.sourceText||'').trim()||(db.draft.name||'').trim())){if(confirm('找到一份尚未正式儲存的草稿，要繼續編輯嗎？\n選擇「取消」會開始一份新的草稿。')){editor=clone(db.draft);editor.id=null;currentView='new';$('#top-title').textContent='新增紀錄';renderCurrent();return}else{db.draft=null;persist()}}editor=freshEditor();setPage('new','新增紀錄')}
function setEditorMode(mode){if(!MODES[mode]||!editor)return;editor.mode=mode;editor.selectedBlocks=[...DEFAULT_BLOCKS[mode]];editor.resultGenerated=false;if(mode==='meeting'&&!editor.name)editor.name='';persistEditor();renderCurrent()}
function titleField(){if(editor.mode==='meeting')return `<div class="field"><label for="meta-name">會議名稱 <span style="color:var(--danger)">*</span></label><input id="meta-name" data-editor-field="name" value="${esc(editor.name)}" placeholder="例如：迎新宿營籌備會議" required></div><div class="field"><label for="meta-date">會議日期</label><input id="meta-date" type="date" data-editor-field="date" value="${esc(editor.date||todayISO())}"><span class="hint">預設為今天，可依實際日期修改。</span></div><div class="field"><label for="meta-people">出席人員 <span class="hint">選填</span></label><input id="meta-people" data-editor-field="people" value="${esc(editor.people)}" placeholder="例如：主席、幹部 A、幹部 B"></div>`;
if(editor.mode==='course')return `<div class="field"><label for="meta-name">課程或筆記名稱 <span style="color:var(--danger)">*</span></label><input id="meta-name" data-editor-field="name" value="${esc(editor.name)}" placeholder="例如：人工智慧概論－神經網路" required></div><div class="field"><label for="meta-date">日期</label><input id="meta-date" type="date" data-editor-field="date" value="${esc(editor.date||todayISO())}"><span class="hint">預設為今天，可修改。</span></div><div class="field"><label for="meta-subject">科目 <span class="hint">選填</span></label><input id="meta-subject" data-editor-field="subject" value="${esc(editor.subject)}" placeholder="例如：人工智慧概論"></div><div class="field"><label for="meta-teacher">教師 <span class="hint">選填</span></label><input id="meta-teacher" data-editor-field="teacher" value="${esc(editor.teacher)}" placeholder="教師姓名"></div>`;
return `<div class="field"><label for="meta-name">紀錄名稱 <span style="color:var(--danger)">*</span></label><input id="meta-name" data-editor-field="name" value="${esc(editor.name)}" placeholder="例如：活動企劃想法討論" required></div><div class="field"><label for="meta-date">日期</label><input id="meta-date" type="date" data-editor-field="date" value="${esc(editor.date||todayISO())}"><span class="hint">預設為今天，可修改。</span></div><div class="field"><label for="meta-participants">參與者 <span class="hint">選填</span></label><input id="meta-participants" data-editor-field="participants" value="${esc(editor.participants)}" placeholder="對話參與者（可留白）"></div>`}
function renderEditor(){if(!editor)editor=freshEditor();const isSaved=Boolean(editor.id);const blockChecks=Object.entries(BLOCKS).map(([key,b])=>{const allowed=key==='notes'||key==='tasks'||key==='decisions'||key==='summary'||key==='keypoints';return `<label class="check-option"><input type="checkbox" data-block-check="${key}" ${editor.selectedBlocks.includes(key)?'checked':''}><span><strong>${b.label}</strong><small>${b.desc}</small></span></label>`}).join('');const reportHas=editor.resultGenerated||Object.values(editor.report||{}).some(v=>String(v||'').trim())||(editor.tasks||[]).length>0;return `
<div class="page-intro"><div><div class="overline">${isSaved?'EDIT YOUR NOTE':'CREATE A NEW NOTE'}</div><h2>${isSaved?'編輯紀錄':'新增一筆紀錄'}</h2><p>先輸入或收音，確認完整內容後再整理。整理結果與待辦都可以修改。</p></div><div class="btn-group"><button class="btn" data-view="dashboard">返回儀表板</button>${isSaved?`<button class="btn danger" data-action="trash-current">移至回收區</button>`:''}</div></div>
<div class="card surface" style="margin-bottom:18px"><div class="section-head"><div><h3>選擇整理模式</h3><p>模式會影響預設報告區塊與本機整理規則。</p></div><span class="badge green">本機可用</span></div><div class="mode-switch">${Object.entries(MODES).map(([k,m])=>`<button class="mode-card ${editor.mode===k?'active':''}" data-action="set-mode" data-mode="${k}"><div class="mode-icon">${m.icon}</div><strong>${m.label}</strong><span>${m.description}</span></button>`).join('')}</div><div class="form-grid">${titleField()}</div></div>
<div class="editor-layout"><div class="card editor-panel"><div class="panel-top"><div><h3>01　輸入內容</h3><p>文字與語音可以混合使用。</p></div><span class="badge">不保存原始音訊</span></div>
<div class="field"><label for="sourceText">逐字稿／文字內容</label><textarea class="record-input-area" id="sourceText" data-editor-field="sourceText" placeholder="貼上會議逐字稿、課堂內容或一段對話……\n\n也可以開啟麥克風，辨識結果會加到這裡。">${esc(editor.sourceText)}</textarea><div class="field-row"><span id="char-counter" class="counter">${editor.sourceText.length.toLocaleString()} 字元</span><button class="btn small" data-action="insert-speaker">＋ 插入發言者標籤</button></div><div class="long-warning" id="long-warning">內容較長，可能影響瀏覽器處理效能。原文不會被自動截斷；若整理失敗，請先備份原文再嘗試分段。</div><div class="speaker-tip">可手動插入「[主席]：」等標籤；系統不會自動猜測發言者身分。</div></div>
<div class="divider"></div><div class="panel-top"><div><h3>語音輸入</h3><p>即時轉為文字，停止後可直接校正。</p></div><span class="badge" id="speech-support-badge">${speechSupported()?'瀏覽器提供支援':'可能不支援'}</span></div><div class="speech-toolbar"><button class="btn primary" data-action="speech-start">● 開始錄音</button><button class="btn" data-action="speech-pause">Ⅱ 暫停</button><button class="btn" data-action="speech-resume">▶ 繼續</button><button class="btn warm" data-action="speech-stop">■ 停止</button></div><div class="speech-status"><span class="pulse" id="speech-pulse"></span><span id="speech-status-text">尚未開始錄音。語音辨識會受瀏覽器、麥克風權限與網路環境影響。</span></div><div class="soft-note" style="margin-top:10px">開始錄音前，請先取得會議參與者必要同意。此網頁只保留辨識文字，不保存原始錄音檔。</div>
<div class="divider"></div><div class="panel-top"><div><h3>02　整理設定</h3><p>選擇這次需要產生的報告區塊。</p></div></div><div class="field"><label for="customFocus">自訂整理重點 <span class="hint">選填</span></label><input id="customFocus" data-editor-field="customFocus" value="${esc(editor.customFocus)}" placeholder="例如：特別整理預算、負責人和截止日期"></div><div class="check-grid">${blockChecks}</div><div class="btn-group"><button class="btn primary" data-action="generate">✦ 以本機規則整理</button><button class="btn" data-action="load-example-text">填入文字範例</button></div><div class="disclaimer" style="margin-top:11px"><span class="dot"></span><span>此功能使用本機規則擷取句子與關鍵字，不是真正的 AI 語意理解。請檢查並修正結果；不確定的負責人、日期或結論不會自動補猜。</span></div></div>
<div class="card report-panel"><div class="panel-top"><div><h3>03　整理結果</h3><p>各區塊可直接修改，再複製、下載或儲存。</p></div>${editor.resultGenerated?'<span class="badge green">已產生結果</span>':''}</div>
${reportHas?renderReportSections():`<div class="report-empty"><div class="empty-icon">✧</div><strong>整理結果會出現在這裡</strong><p>輸入內容並選擇報告區塊，再按「以本機規則整理」。</p></div>`}
${editor.selectedBlocks.includes('tasks')||(editor.tasks||[]).length?renderTaskManager():''}
${reportHas?`<div class="editor-actions"><button class="btn soft" data-action="copy-full">⧉ 複製完整報告</button><button class="btn" data-action="download-txt">↓ 下載 .txt</button><button class="btn" data-action="download-md">↓ 下載 .md</button></div>`:''}
<div class="divider"></div><div class="panel-top"><div><h3>04　${isSaved?'保存修改':'儲存紀錄'}</h3><p>${isSaved?'已保存紀錄的變更會同步到本機。':'檢查整理結果與基本資料後，再正式加入歷史紀錄。'}</p></div></div><div class="btn-group"><button class="btn primary" data-action="save-record">${isSaved?'儲存修改並返回首頁':'儲存紀錄並返回首頁'}</button><button class="btn" data-action="copy-full" ${reportHas?'':'disabled'}>複製完整報告</button></div><div class="soft-note" style="margin-top:10px">${isSaved?'此紀錄已在本機保存。你修改的內容與待辦事項會同步更新。':'未完成的輸入會自動保存為本機草稿；只有按下「儲存紀錄」後，才會正式加入歷史紀錄。'}</div></div></div>
<div class="footer-note">拾記 Memo · 資料僅保存在目前瀏覽器，不會自動同步到其他裝置。</div>`}
function renderReportSections(){const sections=[['summary','精簡摘要'],['keypoints','討論重點'],['decisions','決議與結論'],['notes','課程筆記']];const visible=sections.filter(([k])=>editor.selectedBlocks.includes(k)||String(editor.report[k]||'').trim());return visible.map(([key,label])=>`<div class="report-section"><div class="report-section-head"><strong>${label}</strong><div class="section-actions"><button class="btn small ghost" data-action="copy-block" data-block="${key}">複製</button><button class="btn small" data-action="regenerate-block" data-block="${key}">重新整理此區塊</button></div></div><div class="report-section-body"><textarea class="report-area" data-report-field="${key}" aria-label="${label}" placeholder="整理後的內容會顯示在這裡，你可以直接修改……">${esc(editor.report[key]||'')}</textarea></div></div>`).join('')}
function renderTaskManager(){const tasks=editor.tasks||[];return `<div class="task-manager"><div class="panel-top"><div><h3>待辦事項管理</h3><p>任務可新增、修改與刪除；未明確提及的資料請自行補充。</p></div><div class="btn-group"><button class="btn small ghost" data-action="copy-block" data-block="tasks">複製待辦</button><span class="badge">${tasks.length} 項</span></div></div><div class="add-task-form"><input id="new-task-title" placeholder="新增一項待辦事項……"><button class="btn primary" data-action="add-task">＋ 新增任務</button></div>${tasks.length?`<div class="task-list">${tasks.map(t=>renderTaskCard(t)).join('')}</div>`:`<div class="empty" style="padding:18px"><h4>目前沒有待辦事項</h4><p>可以自行新增，或依原始內容重新整理待辦建議。</p></div>`}</div>`}
function renderTaskCard(t){return `<div class="task-card ${t.status==='done'?'done':''}" data-task-card="${esc(t.id)}"><div class="task-card-top"><input class="task-check" type="checkbox" data-task-field="status-check" data-task-id="${esc(t.id)}" ${t.status==='done'?'checked':''} aria-label="標記任務完成"><div class="task-content"><input class="task-title-input ${t.status==='done'?'completed':''}" data-task-field="title" data-task-id="${esc(t.id)}" value="${esc(t.title)}" aria-label="任務內容"></div><button class="icon-button" data-action="delete-task" data-task-id="${esc(t.id)}" title="刪除任務" aria-label="刪除任務">×</button></div><div class="task-controls"><div class="field"><label>進度</label><select data-task-field="status" data-task-id="${esc(t.id)}">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${t.status===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>優先級</label><select data-task-field="priority" data-task-id="${esc(t.id)}"><option value="" ${!t.priority?'selected':''}>未設定</option><option value="high" ${t.priority==='high'?'selected':''}>高</option><option value="medium" ${t.priority==='medium'?'selected':''}>中</option><option value="low" ${t.priority==='low'?'selected':''}>低</option></select></div><div class="field"><label>負責人</label><input data-task-field="owner" data-task-id="${esc(t.id)}" value="${esc(t.owner||'')}" placeholder="未指定"></div><div class="field"><label>截止日期</label><input type="date" data-task-field="dueDate" data-task-id="${esc(t.id)}" value="${esc(t.dueDate||'')}"></div></div><div class="task-card-bottom"><small>${t.source==='manual'?'手動新增':'整理建議／可編輯'}</small><small>${t.dueDate?`截止：${esc(formatDate(t.dueDate))}`:'尚未設定期限'}</small></div></div>`}
function renderHistory(){const records=[...db.records].filter(r=>{const q=historyFilters.q.trim().toLowerCase();const text=[r.name,r.sourceText,r.report?.summary,r.report?.keypoints,r.report?.decisions,r.report?.notes,(r.tasks||[]).map(t=>`${t.title} ${t.owner}`).join(' '),r.people,r.participants,r.subject,r.teacher].join('\n').toLowerCase();if(q&&!text.includes(q))return false;if(historyFilters.mode!=='all'&&r.mode!==historyFilters.mode)return false;if(historyFilters.from&&(!r.date||r.date<historyFilters.from))return false;if(historyFilters.to&&(!r.date||r.date>historyFilters.to))return false;return true}).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.updatedAt||'').localeCompare(a.updatedAt||''));return `<div class="page-intro"><div><div class="overline">YOUR NOTES</div><h2>歷史紀錄</h2><p>搜尋名稱、逐字稿、摘要、決議與待辦事項，或依日期篩選。</p></div><div class="btn-group"><button class="btn primary" data-action="new-record">＋ 新增紀錄</button><button class="btn" data-action="refresh-history">重新整理</button></div></div><div class="filter-bar"><div class="field" style="flex:2"><label for="history-q">關鍵字搜尋</label><input id="history-q" value="${esc(historyFilters.q)}" placeholder="搜尋場地、預算、課程概念……"></div><div class="field"><label for="history-mode">整理模式</label><select id="history-mode"><option value="all" ${historyFilters.mode==='all'?'selected':''}>全部模式</option>${Object.entries(MODES).map(([k,m])=>`<option value="${k}" ${historyFilters.mode===k?'selected':''}>${m.label}</option>`).join('')}</select></div><div class="field"><label for="history-from">日期起</label><input type="date" id="history-from" value="${esc(historyFilters.from)}"></div><div class="field"><label for="history-to">日期迄</label><input type="date" id="history-to" value="${esc(historyFilters.to)}"></div><button class="btn" data-action="clear-history-filters">清除篩選</button></div><p class="filter-count">找到 ${records.length} 筆紀錄（不含回收區）</p>${records.length?`<div class="history-grid">${records.map(r=>`<div class="history-card"><div class="record-kind ${modeClass(r.mode)}">${modeIcon(r.mode)}</div><div class="history-content"><div class="record-title">${esc(r.name||'未命名紀錄')} ${badgeExample(r)}</div><div class="record-meta">${badgeMode(r.mode)}<span>${esc(formatDate(r.date))}</span><span>更新於 ${esc(formatDateTime(r.updatedAt||r.createdAt))}</span><span>${(r.tasks||[]).filter(t=>t.status!=='done').length} 項未完成任務</span></div><div class="history-excerpt">${esc(r.report?.summary||r.sourceText||'尚無摘要')}</div><div class="btn-group" style="margin-top:10px"><button class="btn small primary" data-action="open-record" data-id="${esc(r.id)}">開啟／修改</button><button class="btn small" data-action="download-record-txt" data-id="${esc(r.id)}">下載 .txt</button><button class="btn small" data-action="download-record-md" data-id="${esc(r.id)}">下載 .md</button></div></div><div class="history-actions"><button class="btn small danger" data-action="trash-record" data-id="${esc(r.id)}">移至回收區</button></div></div>`).join('')}</div>`:`<div class="empty"><div class="empty-icon">⌕</div><h4>${historyFilters.q||historyFilters.from||historyFilters.to?'找不到符合條件的紀錄':'還沒有保存的紀錄'}</h4><p>${historyFilters.q||historyFilters.from||historyFilters.to?'試著換一個關鍵字，或清除日期篩選。':'建立第一筆紀錄後，就能在這裡搜尋、修改與下載。'}</p><div class="btn-group" style="justify-content:center"><button class="btn" data-action="clear-history-filters">清除篩選</button><button class="btn primary" data-action="new-record">新增紀錄</button></div></div>`}<div class="footer-note">範例資料會清楚標示，可以隨時移至回收區。</div>`}
function renderTasksOverview(){let ts=allTasks();if(taskFilter!=='all')ts=ts.filter(t=>t.status===taskFilter);ts.sort((a,b)=>{const aa=a.dueDate||'9999-12-31',bb=b.dueDate||'9999-12-31';return aa.localeCompare(bb)||a.recordName.localeCompare(b.recordName)});return `<div class="page-intro"><div><div class="overline">ALL ACTION ITEMS</div><h2>待辦總覽</h2><p>跨會議集中追蹤任務。從這裡修改進度後，會同步保存到來源紀錄；新增任務請進入所屬紀錄。</p></div><div class="btn-group"><button class="btn" data-view="history">查看紀錄</button><button class="btn primary" data-action="new-record">＋ 新增紀錄</button></div></div><div class="grid stats" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="card stat-card"><div class="stat-top">待處理<span class="stat-icon">○</span></div><div class="stat-num">${taskCounts().todo}</div></div><div class="card stat-card"><div class="stat-top">進行中<span class="stat-icon">◷</span></div><div class="stat-num">${taskCounts().doing}</div></div><div class="card stat-card"><div class="stat-top">已完成<span class="stat-icon">✓</span></div><div class="stat-num">${taskCounts().done}</div></div></div><div class="filter-bar"><div class="field" style="max-width:290px"><label for="task-filter">進度篩選</label><select id="task-filter"><option value="all" ${taskFilter==='all'?'selected':''}>全部任務</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${taskFilter===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="disclaimer"><span class="dot"></span><span>依截止日期排序；未設定期限的任務會排在後面，不會自動推測期限。</span></div></div><p class="filter-count">顯示 ${ts.length} 項任務 · 每項任務都標示其來源紀錄</p>${ts.length?`<div class="tasks-overview">${ts.map(t=>`<div class="task-overview-row"><div class="task-taskinfo"><div class="task-overview-title" style="${t.status==='done'?'text-decoration:line-through;color:var(--muted)':''}">${esc(t.title)}</div><div class="task-overview-meta"><button class="btn small ghost" data-action="open-record" data-id="${esc(t.recordId)}">來源：${esc(t.recordName)} ↗</button></div></div><div class="task-owner"><div class="task-overview-meta">負責人</div><div style="font-size:11px;margin-top:4px">${esc(t.owner||'未指定')}</div></div><div class="task-due"><div class="task-overview-meta">截止日期</div><div style="font-size:11px;margin-top:4px">${esc(t.dueDate?formatDate(t.dueDate):'未設定')}</div></div><div class="task-priority"><span class="priority ${t.priority||''}">${t.priority?({high:'高優先',medium:'中優先',low:'低優先'}[t.priority]):'未設定優先級'}</span></div><div class="task-status"><select class="status-select" data-action="overview-task-status" data-record-id="${esc(t.recordId)}" data-task-id="${esc(t.id)}" aria-label="任務狀態">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${t.status===k?'selected':''}>${v}</option>`).join('')}</select></div></div>`).join('')}</div>`:`<div class="empty"><div class="empty-icon">☷</div><h4>${taskFilter==='all'?'目前沒有待辦事項':`目前沒有「${STATUS[taskFilter]}」任務`}</h4><p>可以先整理一場會議來產生任務建議，或在已保存的會議紀錄中手動新增待辦。</p><div class="btn-group" style="justify-content:center"><button class="btn" data-action="new-record">新增紀錄</button><button class="btn" data-action="clear-task-filter">顯示全部</button></div></div>`}`}
function renderSettings(){return `<div class="page-intro"><div><div class="overline">PREFERENCES & DATA</div><h2>設定與資料管理</h2><p>管理本機資料、備份與還原、隱私資訊，以及查看目前可用的功能。</p></div></div><div class="setting-grid"><div class="card setting-card"><h3>✦ 本機資料整理</h3><p>不用登入就能使用，輸入文字與整理結果都保存在此瀏覽器。</p><div class="setting-list"><div class="setting-line"><span class="emoji">●</span><div><strong>本機規則式整理</strong><small>已可使用：摘要、重點、決議線索、課程筆記與待辦建議。這不是大型語言模型的 AI 理解。</small></div></div><div class="setting-line"><span class="emoji">◌</span><div><strong>真正 AI 整理服務</strong><small>尚未串接。日後需設定安全的服務端；不可將私人 API 金鑰直接寫入公開的 HTML。</small></div></div><div class="setting-line"><span class="emoji">♫</span><div><strong>語音辨識</strong><small>使用瀏覽器提供的語音辨識功能，支援狀況依瀏覽器而異；可能需要網路與麥克風權限。</small></div></div><div class="setting-line"><span class="emoji">▣</span><div><strong>本機儲存</strong><small>不會自動同步其他裝置。清除網站資料或瀏覽器儲存空間可能導致紀錄遺失，建議定期備份。</small></div></div></div></div>
<div class="card setting-card"><h3>⇄ JSON 備份與還原</h3><p>匯出全部資料做備份，或從以前的備份合併回來。</p><div class="btn-group" style="margin-bottom:12px"><button class="btn primary" data-action="export-json">↓ 匯出全部資料</button><label class="btn upload-label">↑ 選擇 JSON 備份<input id="import-file" type="file" accept="application/json,.json" class="hidden"></label></div><div class="soft-note">備份包含正式紀錄、待辦事項、草稿、回收區與部分設定。匯入會先預覽新增、重複及衝突資料，不會立刻覆蓋本機內容。</div><div id="import-preview-container">${renderImportPreview()}</div></div>
<div class="card setting-card"><h3>◉ 隱私與資料處理</h3><p>使用錄音功能前，請確認所有參與者知道並同意被記錄。</p><div class="setting-list"><div class="setting-line"><span class="emoji">1.</span><div>錄音需要由使用者主動開始，畫面會顯示錄音狀態。</div></div><div class="setting-line"><span class="emoji">2.</span><div>本網頁不保存原始音訊，只使用語音辨識結果作為可編輯文字。瀏覽器的語音服務可能會使用外部處理機制。</div></div><div class="setting-line"><span class="emoji">3.</span><div>本機儲存並不等於加密。請勿將高度機密或不應在此裝置保存的資訊輸入網站。</div></div><div class="setting-line"><span class="emoji">4.</span><div>真正 AI 服務未來如需將文字傳送至外部服務，應先說明用途並取得使用者確認。</div></div></div></div>
<div class="card setting-card"><h3>▱ 其他資料操作</h3><p>需要清除或管理已刪除的內容，可以從這裡前往。</p><div class="btn-group"><button class="btn" data-view="trash">開啟回收區 (${db.trash.length})</button><button class="btn danger" data-action="clear-all">清除所有本機資料</button></div><div class="soft-note" style="margin-top:12px">清除操作會永久刪除正式紀錄、草稿、回收區與相關任務，無法復原。建議先匯出 JSON 備份。</div></div></div><div class="footer-note">拾記 Memo · 本機版本 1.0 · 不需要帳號登入</div>`}
function renderTrash(){return `<div class="page-intro"><div><div class="overline">TRASH</div><h2>回收區</h2><p>被移至回收區的紀錄與關聯任務會一起保存。你可以還原整筆紀錄，或永久刪除。</p></div><button class="btn" data-view="settings">設定與資料管理</button></div>${db.trash.length?`<div class="history-grid">${[...db.trash].sort((a,b)=>(b.deletedAt||'').localeCompare(a.deletedAt||'')).map(r=>`<div class="trash-row"><div class="record-row" style="padding:0;flex:1"><div class="record-kind ${modeClass(r.mode)}">${modeIcon(r.mode)}</div><div class="record-main"><div class="record-title">${esc(r.name||'未命名紀錄')} ${badgeExample(r)}</div><div class="record-meta">${badgeMode(r.mode)}<span>${esc(formatDate(r.date))}</span><span>刪除於 ${esc(formatDateTime(r.deletedAt))}</span><span>${(r.tasks||[]).length} 項關聯任務</span></div></div></div><div class="btn-group"><button class="btn small soft" data-action="restore-record" data-id="${esc(r.id)}">還原</button><button class="btn small danger" data-action="purge-record" data-id="${esc(r.id)}">永久刪除</button></div></div>`).join('')}</div><div class="btn-group" style="margin-top:15px"><button class="btn danger" data-action="empty-trash">清空回收區</button></div>`:`<div class="empty"><div class="empty-icon">▱</div><h4>回收區目前是空的</h4><p>你移除的紀錄會先出現在這裡，避免不小心永久刪除。</p><button class="btn" data-view="history">回到歷史紀錄</button></div>`}`}
function bindViewEvents(){const root=$('#view');root.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.view,viewTitle(b.dataset.view))));root.querySelectorAll('[data-action]').forEach(b=>{if(b.tagName==='SELECT'&&b.dataset.action==='overview-task-status')return;if(!b.dataset.boundAction){b.dataset.boundAction='1';b.addEventListener('click',handleAction)}});
if($('#history-q'))$('#history-q').addEventListener('input',e=>{historyFilters.q=e.target.value;const pos=e.target.selectionStart;const val=e.target.value;const v=$('#view');v.innerHTML=renderHistory();bindViewEvents();const q=$('#history-q');q.focus();q.setSelectionRange(pos,pos)});
['history-mode','history-from','history-to'].forEach(id=>{const el=$('#'+id);if(el)el.addEventListener('change',()=>{if(id==='history-mode')historyFilters.mode=el.value;else if(id==='history-from')historyFilters.from=el.value;else historyFilters.to=el.value;renderCurrent()})});
if($('#task-filter'))$('#task-filter').addEventListener('change',e=>{taskFilter=e.target.value;renderCurrent()});
if($('#import-file'))$('#import-file').addEventListener('change',handleImportFile);
root.querySelectorAll('[data-action="overview-task-status"]').forEach(el=>el.addEventListener('change',()=>{updateTaskInRecord(el.dataset.recordId,el.dataset.taskId,{status:el.value});toast('任務進度已同步保存');renderCurrent()}));
if(currentView==='new'||currentView==='editor')bindEditorEvents();
if(importPlan)bindImportPlanEvents();}
function viewTitle(view){return ({dashboard:'儀表板',history:'歷史紀錄',tasks:'待辦總覽',settings:'設定與資料管理',trash:'回收區',new:'新增紀錄',editor:'編輯紀錄'})[view]||'拾記 Memo'}
function bindEditorEvents(){if(!editor)return;const root=$('#view');root.querySelectorAll('[data-editor-field]').forEach(el=>el.addEventListener('input',()=>{editor[el.dataset.editorField]=el.value;if(el.id==='sourceText'){const c=$('#char-counter');if(c){c.textContent=`${el.value.length.toLocaleString()} 字元`;c.classList.toggle('warn',el.value.length>8000)}const w=$('#long-warning');if(w)w.style.display=el.value.length>8000?'block':'none'}persistEditor();}));
root.querySelectorAll('[data-report-field]').forEach(el=>el.addEventListener('input',()=>{editor.report[el.dataset.reportField]=el.value;persistEditor()}));
root.querySelectorAll('[data-block-check]').forEach(el=>el.addEventListener('change',()=>{const key=el.dataset.blockCheck;if(el.checked&&!editor.selectedBlocks.includes(key))editor.selectedBlocks.push(key);else editor.selectedBlocks=editor.selectedBlocks.filter(k=>k!==key);persistEditor();renderCurrent()}));
root.querySelectorAll('[data-task-field]').forEach(el=>{const update=()=>{const t=editor.tasks.find(t=>t.id===el.dataset.taskId);if(!t)return;if(el.dataset.taskField==='status-check')t.status=el.checked?'done':'todo';else t[el.dataset.taskField]=el.value;persistEditor();if(el.dataset.taskField==='status-check'||el.dataset.taskField==='status'){renderCurrent();}else{const card=el.closest('.task-card');if(card&&el.dataset.taskField==='title')el.classList.toggle('completed',t.status==='done');}};el.addEventListener('change',update)});

function splitSentences(text){return String(text||'').replace(/\r/g,'\n').split(/\n+|(?<=[。！？!?；;])\s*/).map(s=>s.replace(/^\s*[\-•*\d.、)）]+\s*/,'').trim()).filter(s=>s.length>=5)}
function ruleSummary(text,focus){const s=splitSentences(text);if(!s.length)return '';const fs=(focus||'').split(/[，,、；;\s]+/).filter(x=>x.length>1);const ranked=s.map((t,i)=>({t,i,score:(/(決議|決定|結論|重點|因此|所以|需要|負責|確認|期限|預算|目的|主要|問題|方案|考試|定義|原理)/.test(t)?2:0)+(fs.some(f=>t.toLowerCase().includes(f.toLowerCase()))?5:0)})).sort((a,b)=>b.score-a.score||a.i-b.i);const pick=ranked.slice(0,Math.min(3,ranked.length)).sort((a,b)=>a.i-b.i).map(x=>x.t);return pick.map((t,i)=>`${i+1}. ${t}`).join('\n')}
function ruleKeypoints(text,focus){const s=splitSentences(text);const fs=(focus||'').split(/[，,、；;\s]+/).filter(x=>x.length>1);const scored=s.map((t,i)=>({t,i,score:(/(重要|重點|需要|必須|決議|決定|問題|原因|方法|首先|其次|最後|例如|因此|負責|期限|預算|目標|定義|原理|觀念|注意|建議)/.test(t)?2:0)+(fs.some(f=>t.toLowerCase().includes(f.toLowerCase()))?4:0)})).sort((a,b)=>b.score-a.score||a.i-b.i);const picked=scored.slice(0,Math.min(8,scored.length)).sort((a,b)=>a.i-b.i);return picked.map(x=>`• ${x.t}`).join('\n')}
function ruleDecisions(text){const s=splitSentences(text);const found=s.filter(t=>/(決議|決定|結論|確定|敲定|同意|通過|採用|改為|定案|最後決定|共識)/.test(t));return found.length?found.map(t=>`• ${t}`).join('\n'):'未從文字中明確找到決議或結論。請確認原始內容，若有決議可在此補充；系統不會自行推測。'}
function ruleNotes(text,focus){const s=splitSentences(text);if(!s.length)return '';const definitions=s.filter(t=>/(是指|定義|代表|稱為|原理|概念|公式|原因|例如|特性|差異|步驟|方法|優點|缺點|注意)/.test(t));const key=definitions.length?definitions:s;const unique=[...new Set(key)].slice(0,12);return `【課程概覽】\n${ruleSummary(text,focus)||'尚無足夠內容。'}\n\n【觀念與重要資訊】\n${unique.map(t=>`• ${t}`).join('\n')}\n\n【複習提醒】\n請依照課程需求補充不熟悉的名詞、例題或待確認觀念。`}
function explicitOwner(text){let m=text.match(/(?:由|交由)\s*([^，。；;]{1,12}?)\s*(?:來)?負責/);if(m)return m[1].trim();m=text.match(/負責人\s*[:：=]\s*([^，。；;\s]{1,10})/);if(m)return m[1];m=text.match(/([\u4e00-\u9fa5A-Za-z0-9]{2,12}(?:\s+[A-Za-z0-9]{1,4})?)\s*(?:負責|來處理|承辦)/);if(m&&/(幹部|主席|組長|負責人|小組|[A-Z]|[0-9])/.test(m[1]))return m[1].trim();return ''}
function explicitDate(text){const m=text.match(/(?:截止日期?|期限|於|在|完成日期?)[^\d]{0,6}(20\d{2})\s*[-/.年]\s*(\d{1,2})\s*[-/.月]\s*(\d{1,2})\s*日?/);if(!m)return '';const y=Number(m[1]),mo=Number(m[2]),d=Number(m[3]);if(mo<1||mo>12||d<1||d>31)return '';return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function explicitPriority(text){if(/高優先|優先級高|最高優先/.test(text))return 'high';if(/中優先|優先級中/.test(text))return 'medium';if(/低優先|優先級低/.test(text))return 'low';return ''}
function extractTasks(text){const lines=String(text||'').replace(/\r/g,'\n').split(/[\n。！？!?；;]+/).map(x=>x.trim().replace(/^[-•*\d.、)）\s]+/,'' )).filter(Boolean);const keywords=/(待辦|負責|需要|必須|請|確認|安排|完成|準備|提交|追蹤|聯絡|聯繫|預約|截止|期限|下次|記得|後續|製作|整理|寄出|統計|規劃|繳交|補上|檢查|通知|更新|準備|報名|詢價|採購|討論)/;const out=[];for(const line of lines){if(!keywords.test(line)||line.length<5||line.length>200)continue;if(/^(今天|今天的|我覺得|大家認為)/.test(line)&&!/(負責|需要|必須|請|確認|安排|完成|準備|截止|期限|後續)/.test(line))continue;const title=line.replace(/^(待辦事項|待辦|後續工作|行動項目)[：: ]*/,'').trim();if(!title||out.some(t=>t.title===title))continue;out.push({id:makeId(),title,owner:explicitOwner(line),dueDate:explicitDate(line),priority:explicitPriority(line),status:'todo',source:'rule'});if(out.length>=20)break}return out}
function generateReport(forceBlock=null){if(!editor)return;if(!editor.sourceText.trim()){toast('請先輸入或貼上內容，再進行整理。',true);$('#sourceText')?.focus();return}const selected=forceBlock?[forceBlock]:editor.selectedBlocks.slice();if(!selected.length){toast('請至少選擇一個報告區塊。',true);return}const haveExisting=selected.some(k=>(k==='tasks'?editor.tasks.length:!!String(editor.report[k]||'').trim()));if(haveExisting){const labels=selected.map(k=>k==='tasks'?'待辦事項':BLOCKS[k]?.label||k).join('、');if(!confirm(`重新整理將更新以下區塊：${labels}\n\n這些區塊中手動修改的內容可能被覆蓋。其他未選取區塊會保留。要繼續嗎？`))return}if(selected.includes('tasks')&&editor.tasks.length&&!confirm('重新整理待辦事項會取代目前的任務建議。既有任務與進度會被替換。請確認你已自行記錄需要保留的變更。要繼續嗎？'))return;const source=editor.sourceText;try{if(selected.includes('summary'))editor.report.summary=ruleSummary(source,editor.customFocus);if(selected.includes('keypoints'))editor.report.keypoints=ruleKeypoints(source,editor.customFocus);if(selected.includes('decisions'))editor.report.decisions=ruleDecisions(source);if(selected.includes('notes'))editor.report.notes=ruleNotes(source,editor.customFocus);if(selected.includes('tasks'))editor.tasks=extractTasks(source);editor.resultGenerated=true;persistEditor();renderCurrent();toast('已依照本機規則產生整理結果，請檢查並修正。')}catch(err){console.error(err);toast('整理時發生問題。原始文字已保留，請稍後重試或減少單次內容。',true)}}

function downloadEditor(ext){if(!editor)return;const r=currentRecordSnapshot();downloadBlob(ext==='md'?markdownReport(r):fullReportText(r),`${safeFilename(r.name)}.${ext}`,ext==='md'?'text/markdown;charset=utf-8':'text/plain;charset=utf-8');toast(`已下載 .${ext} 檔案`)}
function downloadRecord(id,ext){const r=db.records.find(r=>r.id===id);if(!r)return;downloadBlob(ext==='md'?markdownReport(r):fullReportText(r),`${safeFilename(r.name)}.${ext}`,ext==='md'?'text/markdown;charset=utf-8':'text/plain;charset=utf-8');toast(`已下載 .${ext} 檔案`)}
async function trashRecord(id){const r=db.records.find(r=>r.id===id);if(!r){toast('找不到這筆紀錄',true);return}if(!await askModal('將紀錄移至回收區？',`「${r.name}」與相關的 ${r.tasks?.length||0} 項待辦會一起移至回收區，可以之後還原。`,'移至回收區',true))return;db.records=db.records.filter(x=>x.id!==id);db.trash.push({...r,deletedAt:new Date().toISOString()});if(editor?.id===id)editor=null;persist();setPage('history','歷史紀錄');toast('紀錄與關聯任務已移至回收區')}
function restoreRecord(id){const r=db.trash.find(r=>r.id===id);if(!r)return;if(db.records.some(x=>x.id===r.id)){toast('已有相同識別碼的紀錄，無法直接還原。',true);return}const copy=clone(r);delete copy.deletedAt;db.records.push(copy);db.trash=db.trash.filter(x=>x.id!==id);persist();renderCurrent();toast('已還原紀錄與關聯任務')}
async function purgeRecord(id){const r=db.trash.find(r=>r.id===id);if(!r)return;if(!await askModal('永久刪除這筆紀錄？',`「${r.name}」及 ${r.tasks?.length||0} 項相關任務將永久刪除，無法透過回收區還原。`,'永久刪除',true))return;db.trash=db.trash.filter(x=>x.id!==id);persist();renderCurrent();toast('已永久刪除紀錄')}
async function emptyTrash(){if(!db.trash.length)return;if(!await askModal('清空回收區？',`這會永久刪除 ${db.trash.length} 筆紀錄與關聯任務，無法復原。`,'清空回收區',true))return;db.trash=[];persist();renderCurrent();toast('回收區已清空')}
function updateTaskInRecord(recordId,taskId,patch){const r=db.records.find(r=>r.id===recordId);if(!r)return;const t=(r.tasks||[]).find(t=>t.id===taskId);if(!t)return;Object.assign(t,patch);r.updatedAt=new Date().toISOString();persist();if(editor?.id===recordId){editor=clone(r)}}
function exportJSON(){const bundle={app:'拾記 Memo',version:1,exportedAt:new Date().toISOString(),records:db.records,trash:db.trash,draft:db.draft,settings:db.settings};downloadBlob(JSON.stringify(bundle,null,2),`拾記Memo_備份_${todayISO()}.json`,'application/json;charset=utf-8');toast('已匯出全部本機資料')}
function signature(r){return JSON.stringify({mode:r.mode,name:(r.name||'').trim(),date:r.date||'',source:(r.sourceText||'').replace(/\s+/g,' ').trim(),report:r.report||{},tasks:(r.tasks||[]).map(t=>({title:t.title,status:t.status,owner:t.owner,dueDate:t.dueDate,priority:t.priority}))})}
function possibleMatch(a,b){if(!a||!b)return false;const name=(a.name||'').trim().toLowerCase(),name2=(b.name||'').trim().toLowerCase();if(!name||name!==name2||(a.date||'')!==(b.date||''))return false;const x=(a.sourceText||'').replace(/\s+/g,' ').trim(),y=(b.sourceText||'').replace(/\s+/g,' ').trim();if(!x||!y)return true;return x.slice(0,60)===y.slice(0,60)||x.includes(y.slice(0,Math.min(40,y.length)))||y.includes(x.slice(0,Math.min(40,x.length)))}
async function handleImportFile(e){const file=e.target.files?.[0];if(!file)return;try{const text=await file.text();const data=JSON.parse(text);const incoming=Array.isArray(data)?{records:data}:data;if(!incoming||!Array.isArray(incoming.records))throw new Error('備份格式中找不到 records 陣列');const current=db.records;const items=[];incoming.records.forEach((raw,index)=>{if(!raw||typeof raw!=='object')return;const r=clone(raw);r.mode=MODES[r.mode]?r.mode:'meeting';r.report=r.report&&typeof r.report==='object'?r.report:{summary:'',keypoints:'',decisions:'',notes:''};r.tasks=Array.isArray(r.tasks)?r.tasks:[];r.selectedBlocks=Array.isArray(r.selectedBlocks)?r.selectedBlocks:DEFAULT_BLOCKS[r.mode].slice();if(r.id){const same=current.find(x=>x.id===r.id);if(same){items.push({index,record:r,kind:signature(same)===signature(r)?'same':'conflict',targetId:same.id,choice:signature(same)===signature(r)?'skip':'keep'});return}}const match=current.find(x=>possibleMatch(x,r));if(match){items.push({index,record:r,kind:'possible',targetId:match.id,choice:'skip'});return}items.push({index,record:r,kind:'new',targetId:null,choice:'add'})});importPlan={incoming,items,filename:file.name};$('#import-preview-container').innerHTML=renderImportPreview();bindImportPlanEvents();toast('已讀取備份，請檢查匯入預覽。')}catch(err){console.error(err);toast('無法讀取備份檔：請確認選擇的是拾記 Memo 的 JSON 備份。',true)}finally{e.target.value=''}}
function renderImportPreview(){if(!importPlan)return '';const stats={new:importPlan.items.filter(x=>x.kind==='new').length,same:importPlan.items.filter(x=>x.kind==='same').length,conflict:importPlan.items.filter(x=>x.kind==='conflict').length,possible:importPlan.items.filter(x=>x.kind==='possible').length};return `<div class="import-preview"><div class="section-head"><div><h3>匯入預覽</h3><p>檔案：${esc(importPlan.filename)}</p></div><button class="btn small" data-action="import-cancel">取消</button></div><div class="tag-row"><span class="badge green">新增 ${stats.new}</span><span class="badge">完全相同 ${stats.same}</span><span class="badge warm">內容衝突 ${stats.conflict}</span><span class="badge red">可能重複 ${stats.possible}</span></div><p class="muted" style="font-size:11px">新增項目會匯入；完全相同的紀錄自動略過。其他衝突需選擇處理方式後再確認。</p>${importPlan.items.map((it,i)=>`<div class="import-item"><div><strong>${esc(it.record.name||'未命名紀錄')} ${it.kind==='new'?'<span class="badge green">新增</span>':it.kind==='same'?'<span class="badge">相同</span>':it.kind==='possible'?'<span class="badge red">可能重複</span>':'<span class="badge warm">內容不同</span>'}</strong><small>${esc(formatDate(it.record.date))} · ${esc(MODES[it.record.mode]?.label||'紀錄')}${it.targetId?' · 與本機項目比對':' · 備份項目'}</small></div>${it.kind==='new'?'<span class="muted" style="font-size:11px">將作為新紀錄匯入</span>':it.kind==='same'?'<span class="muted" style="font-size:11px">自動略過，避免重複</span>':`<select data-import-choice="${i}">${(it.kind==='conflict'?[['keep','保留本機版本'],['replace','以匯入版本取代']]:[['skip','保留本機／略過'],['add','作為新紀錄匯入'],['replace','以匯入版本取代候選']]).map(([v,l])=>`<option value="${v}" ${it.choice===v?'selected':''}>${l}</option>`).join('')}</select>`}</div>`).join('')||'<p class="muted">備份沒有紀錄資料。</p>'}<div class="btn-group" style="margin-top:14px"><button class="btn primary" data-action="import-apply">確認並合併匯入</button><button class="btn" data-action="import-cancel">取消</button></div></div>`}
function bindImportPlanEvents(){if(!importPlan)return;const box=$('#import-preview-container');if(!box)return;box.querySelectorAll('[data-import-choice]').forEach(el=>{if(el.dataset.boundChoice)return;el.dataset.boundChoice='1';el.addEventListener('change',()=>{if(importPlan?.items[Number(el.dataset.importChoice)])importPlan.items[Number(el.dataset.importChoice)].choice=el.value})});box.querySelectorAll('[data-action="import-apply"],[data-action="import-cancel"]').forEach(b=>{if(!b.dataset.boundAction){b.dataset.boundAction='1';b.addEventListener('click',handleAction)}})}
async function applyImport(){if(!importPlan)return;const plan=importPlan;if(!await askModal('確認合併匯入？',`將匯入 ${plan.items.filter(x=>x.kind==='new'||x.kind==='conflict'&&x.choice==='replace'||x.kind==='possible'&&(x.choice==='add'||x.choice==='replace')).length} 項新資料或更新項目。請確認衝突處理方式。`,'確認匯入'))return;let added=0,replaced=0,skipped=0;plan.items.forEach(it=>{if(it.kind==='same'){skipped++;return}if(it.kind==='new'){const r=clone(it.record);if(!r.id||db.records.some(x=>x.id===r.id)||db.trash.some(x=>x.id===r.id))r.id=makeId();r.createdAt=r.createdAt||new Date().toISOString();r.updatedAt=new Date().toISOString();db.records.push(r);added++;return}if(it.choice==='keep'||it.choice==='skip'){skipped++;return}if(it.choice==='add'){const r=clone(it.record);r.id=makeId();r.createdAt=r.createdAt||new Date().toISOString();r.updatedAt=new Date().toISOString();db.records.push(r);added++;return}if(it.choice==='replace'){const i=db.records.findIndex(x=>x.id===it.targetId);const r=clone(it.record);if(i>=0){r.id=db.records[i].id;r.createdAt=db.records[i].createdAt||r.createdAt;r.updatedAt=new Date().toISOString();db.records[i]=r;replaced++}else{r.id=makeId();db.records.push(r);added++}}});const incomingTrash=Array.isArray(plan.incoming.trash)?plan.incoming.trash:[];incomingTrash.forEach(raw=>{if(!raw||!raw.id)return;const present=db.records.some(r=>r.id===raw.id)||db.trash.some(r=>r.id===raw.id);if(!present)db.trash.push(raw)});if(!db.draft&&plan.incoming.draft&&typeof plan.incoming.draft==='object'){const d=clone(plan.incoming.draft);d.id=null;db.draft=d}db.settings={...db.settings,...(plan.incoming.settings||{})};importPlan=null;persist();renderCurrent();toast(`匯入完成：新增 ${added}、更新 ${replaced}、略過 ${skipped} 筆。`)}
async function clearAllData(){if(!await askModal('清除所有本機資料？','此操作將永久刪除正式紀錄、未完成草稿、回收區與相關待辦，且無法復原。建議先匯出 JSON 備份。','繼續',true))return;if(!await askModal('最後確認：永久清除？','按下「永久清除」後，拾記 Memo 在此瀏覽器中的所有資料都將消失。','永久清除',true))return;localStorage.removeItem(DB_KEY);db={records:[],trash:[],draft:null,settings:{}};editor=null;importPlan=null;persist();setPage('dashboard','儀表板');toast('本機資料已清除')}
function install(){updateNavCounts();renderCurrent();if(!speechSupported()){$('#speech-support-badge')&&($('#speech-support-badge').textContent='可能不支援')}document.addEventListener('click',e=>{const actionButton=e.target.closest('.sidebar [data-action]');if(actionButton){handleAction({currentTarget:actionButton});return}const b=e.target.closest('[data-view]');if(b&&b.closest('.sidebar')){setPage(b.dataset.view,viewTitle(b.dataset.view));return}if(b&&b.closest('#view')===null){setPage(b.dataset.view,viewTitle(b.dataset.view))}});$('#mobile-menu').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));document.addEventListener('click',e=>{if(window.innerWidth<=760&&$('#sidebar').classList.contains('open')&&!e.target.closest('#sidebar')&&!e.target.closest('#mobile-menu'))$('#sidebar').classList.remove('open')});window.addEventListener('beforeunload',()=>{if(editor&&!editor.id){db.draft=clone(editor);persist()}if(speechActive)speechStop(true)});}
install();
})();
</script>
</body>
